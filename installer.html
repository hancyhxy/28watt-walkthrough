<!doctype html>
<html lang="zh"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>28Watt · Installer journey / 安装商流程</title>
<style>
:root{--teal:#25576e;--teal2:#1b4556;--mint:#5cc48d;--mint2:#c7e7c4;--mintbg:#eef9f3;--cream:#fdf7e3;--ink:#1d2b33;--mute:#62717a;--line:#dbe6e2;--warn:#c0661c;--warnbg:#fff3e6;--red:#d64545;--bg:#f4f2ee}
*{box-sizing:border-box}
body{margin:0;font:14px/1.55 -apple-system,"PingFang SC",system-ui,sans-serif;color:var(--ink);background:#f7faf9}
body.en [lang=zh],body:not(.en) [lang=en]{display:none!important}
header{display:flex;align-items:center;justify-content:space-between;padding:14px 22px;border-bottom:1px solid var(--line);background:#fff;position:sticky;top:0;z-index:5}
header h1{font-size:18px;margin:0;color:var(--teal)}
header .links a{color:var(--mute);font-size:13px;margin-left:12px}
.lang{display:flex;background:#fff;border:1px solid var(--line);border-radius:99px;padding:3px;margin-left:14px}
.lang button{border:0;background:none;padding:4px 11px;border-radius:99px;font:600 12.5px system-ui;color:var(--mute);cursor:pointer}
.lang button.on{background:var(--teal);color:#fff}
.layout{display:grid;grid-template-columns:230px 1fr 300px;gap:18px;padding:18px 22px;max-width:1500px;margin:0 auto}
@media(max-width:1150px){.layout{grid-template-columns:1fr}.rail{order:3}.notes{order:2}}
/* rail */
.rail{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px;align-self:start;position:sticky;top:70px}
.rail h4{margin:12px 6px 4px;font-size:11px;letter-spacing:.5px;text-transform:uppercase;color:var(--mute)}
.rail h4:first-child{margin-top:2px}
.rail button{display:flex;gap:8px;width:100%;text-align:left;border:0;background:none;padding:6px 8px;border-radius:8px;font:13px/1.35 inherit;color:var(--ink);cursor:pointer}
.rail button .n{flex:0 0 20px;height:20px;border-radius:50%;background:var(--line);color:var(--mute);font-size:11px;display:flex;align-items:center;justify-content:center;font-weight:700}
.rail button.on{background:var(--mintbg)}
.rail button.on .n{background:var(--teal);color:#fff}
.rail button.done .n{background:var(--mint2);color:var(--teal)}
/* stage */
.stage{min-width:0}
.ctrl{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.ctrl .t{font-weight:700;color:var(--teal);font-size:16px}
.ctrl button{border:1px solid var(--line);background:#fff;border-radius:99px;padding:6px 14px;cursor:pointer;font:600 13px system-ui;color:var(--teal)}
.ctrl button.primary{background:var(--teal);color:#fff;border-color:var(--teal)}
.browser{background:#fff;border:1px solid #cdd8d4;border-radius:12px;overflow:hidden;box-shadow:0 12px 34px #0000001a}
.chrome{background:#eef1f0;padding:7px 12px;display:flex;gap:6px;align-items:center;border-bottom:1px solid #dde3e1}
.chrome i{width:10px;height:10px;border-radius:50%;background:#d6dbd9;display:inline-block}
.chrome .url{margin-left:10px;background:#fff;border-radius:6px;padding:2px 10px;font-size:12px;color:var(--mute);flex:1}
.screen{min-height:560px;font-family:"Wix Madefor Display",Poppins,-apple-system,system-ui,sans-serif;position:relative}
/* app ui */
.topnav{display:flex;align-items:center;justify-content:space-between;padding:12px 22px;border-bottom:1px solid var(--line)}
.logo{display:flex;align-items:center;gap:6px;font-weight:800;font-size:19px;color:var(--teal)}
.logo b{color:var(--mint)}
.logo svg{width:24px;height:24px}
.pill{border-radius:99px;padding:8px 18px;font-weight:600;font-size:13px;display:inline-block}
.pill.dark{background:var(--teal);color:#fff}
.pill.ghost{border:1px solid var(--teal);color:var(--teal)}
.pill.mint{background:var(--mint2);color:var(--teal)}
.pill.dis{background:#b9c9cf;color:#fff}
.wiz{display:grid;grid-template-columns:200px 1fr;min-height:510px}
.wiz .steps{padding:24px 20px}
.st{display:flex;gap:10px;align-items:center;margin-bottom:22px;font-size:13px;color:var(--teal)}
.st .c{width:24px;height:24px;border-radius:50%;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:11px}
.st.on .c{background:var(--mint2);border-color:var(--mint2);font-weight:700}
.st.done .c{background:var(--teal);color:#fff;border-color:var(--teal)}
.wiz .main{padding:26px 40px 26px 10px;display:flex;flex-direction:column}
.h{font-size:26px;font-weight:700;color:var(--teal);text-align:center;margin:6px 0 2px}
.hs{text-align:center;color:var(--mute);margin-bottom:18px}
.formcard{border:1px solid #cfeedd;border-radius:22px;padding:18px 20px;background:#fbfefc}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.f{margin-bottom:10px}
.f label{display:block;font-size:12px;color:var(--teal);margin-bottom:4px}
.f label i{color:var(--red);font-style:normal}
.inp{border:1px solid #cfe0e6;border-radius:8px;padding:9px 11px;color:#8a9aa1;font-size:13px;background:#fff}
.inp.v{color:var(--ink)}
.inp.ai{border-color:var(--mint);background:var(--mintbg);color:var(--ink);display:flex;justify-content:space-between}
.inp.ai em{font-style:normal;font-size:10.5px;color:#1f8a57;background:#d6f3e3;border-radius:4px;padding:0 6px}
.drop{border:1.5px dashed #c3d6dc;border-radius:12px;padding:22px;text-align:center;color:var(--mute);font-size:12.5px}
.drop .up{width:30px;height:30px;border-radius:50%;background:var(--teal);color:#fff;display:inline-flex;align-items:center;justify-content:center;margin-bottom:6px}
.or{display:flex;align-items:center;gap:8px;color:var(--mute);font-size:12px;margin:10px 0}.or:before,.or:after{content:"";flex:1;height:1px;background:var(--line)}
.foot{margin-top:auto;display:flex;justify-content:space-between;align-items:center;padding-top:18px}
.back{color:var(--teal);font-size:13px}
.radio{display:flex;gap:8px}.radio span{border:1px solid var(--line);border-radius:8px;padding:7px 14px;font-size:13px}.radio span.sel{border-color:var(--teal);background:var(--mintbg);font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chips span{border:1px solid var(--line);border-radius:99px;padding:4px 10px;font-size:12px}.chips span.sel{background:var(--mint2);border-color:var(--mint2);color:var(--teal);font-weight:600}
.otp{display:flex;gap:8px;justify-content:center;margin:14px 0}.otp span{width:42px;height:50px;border:1px solid #cfe0e6;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:700;color:var(--teal)}
.center{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px;min-height:510px}
.badge{width:64px;height:64px;border-radius:50%;background:var(--mintbg);display:flex;align-items:center;justify-content:center;font-size:30px;margin-bottom:10px}
/* portal shell */
.shell{display:grid;grid-template-columns:200px 1fr;min-height:510px;background:var(--bg)}
.side{background:#fff;border-right:1px solid var(--line);padding:16px 12px;font-size:13px}
.side .org{font-weight:700;color:var(--teal);margin-bottom:2px}.side .orgs{font-size:11.5px;color:var(--mute);margin-bottom:14px}
.side .new{display:block;text-align:center;margin-bottom:14px}
.side .it{padding:7px 10px;border-radius:8px;color:var(--teal);display:flex;justify-content:space-between}
.side .it.on{background:var(--mintbg);font-weight:600}
.side .it b{background:var(--mint2);border-radius:99px;font-size:11px;padding:0 7px}
.side .grp{font-size:10.5px;letter-spacing:.5px;color:var(--mute);margin:12px 10px 4px;text-transform:uppercase}
.pmain{padding:18px 22px;min-width:0}
.ph{font-size:22px;font-weight:700;color:var(--teal);margin:0}
.phs{color:var(--mute);font-size:12.5px;margin-bottom:12px}
.search{background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 12px;color:#9aa8ad;font-size:12.5px;margin-bottom:10px}
.alert{background:#fff;border:1px solid var(--line);border-radius:12px;padding:11px 13px;display:flex;gap:12px;margin-bottom:8px}
.alert .ic{flex:0 0 36px;height:36px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:16px}
.alert .tt{font-weight:600}.alert .ds{color:var(--mute);font-size:12.5px}
.alert .ac{font-size:12px;margin-top:4px}.alert .ac code{background:#eef1f0;border-radius:4px;padding:1px 6px;margin-right:6px;font-size:11px}
.alert .ac a{color:#1f8a57;font-weight:600}
.alert.hl{border-left:4px solid var(--mint)}
.alert.act{border-left:4px solid var(--warn)}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:10px}
.card h5{margin:0 0 8px;font-size:13px;color:var(--teal)}
.tl{display:flex;gap:0;margin:6px 0 4px}
.tl div{flex:1;text-align:center;font-size:11px;color:var(--mute);position:relative;padding-top:20px}
.tl div:before{content:"";position:absolute;top:6px;left:50%;width:12px;height:12px;border-radius:50%;background:var(--line);transform:translateX(-50%);z-index:1}
.tl div:after{content:"";position:absolute;top:11px;left:0;right:0;height:2px;background:var(--line)}
.tl div.d:before{background:var(--teal)}.tl div.d:after{background:var(--teal)}
.tl div.c:before{background:var(--warn);box-shadow:0 0 0 4px var(--warnbg)}.tl div.c{color:var(--warn);font-weight:700}
.doc{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid #eef1f0;font-size:12.5px}
.doc:last-child{border:0}
.s-ok{color:#1f8a57;font-weight:600}.s-wait{color:var(--warn);font-weight:600}.s-no{color:var(--mute)}
.msg{background:#f4f7f6;border-radius:10px;padding:8px 10px;margin:6px 0;font-size:12.5px}
.msg.me{background:var(--mintbg);margin-left:40px}
.g2{display:grid;grid-template-columns:1.3fr 1fr;gap:10px}
.kpi{display:flex;gap:10px;margin-bottom:10px}.kpi div{flex:1;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px}.kpi b{display:block;font-size:20px;color:var(--teal)}.kpi span{font-size:11.5px;color:var(--mute)}
.loader{width:56px;height:56px;border-radius:50%;border:5px solid var(--mintbg);border-top-color:var(--mint);animation:sp 1s linear infinite;margin-bottom:16px}
@keyframes sp{to{transform:rotate(360deg)}}
.chk{text-align:left;margin-top:14px;font-size:13.5px}
.chk div{margin:6px 0}.chk .y{color:#1f8a57}.chk .w{color:var(--warn)}.chk .g{color:#b0bcc0}
.modal{position:absolute;inset:0;background:#1d2b3366;display:flex;align-items:center;justify-content:center}
.modal .box{background:#fff;border-radius:16px;padding:20px 22px;width:420px;box-shadow:0 20px 40px #0003}
.tbl{width:100%;border-collapse:collapse;font-size:12.5px}.tbl td,.tbl th{padding:7px 6px;border-bottom:1px solid #eef1f0;text-align:left}.tbl th{color:var(--mute);font-weight:500;font-size:11.5px}
/* notes */
.notes{align-self:start;position:sticky;top:70px}
.nc{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:12px}
.nc h3{margin:0 0 6px;font-size:14px;color:var(--teal)}
.nc p{margin:4px 0;font-size:13px}
.tag{display:inline-block;font-size:11.5px;padding:1px 8px;border-radius:99px;margin-bottom:6px}
.tag.v{background:var(--mintbg);color:#1f8a57}.tag.i{background:var(--warnbg);color:var(--warn)}
.nc.op{background:var(--cream);border-color:#efe3b8}
.nc.op h3{color:#8a6a10}
.kbd{font-size:12px;color:var(--mute);text-align:center;margin-top:8px}
</style></head><body>
<header>
<h1><span lang="zh">安装商（Installer）流程：按目前理解还原</span><span lang="en">Installer journey: current state as understood</span></h1>
<div style="display:flex;align-items:center"><span class="links"><a href="index.html"><span lang="zh">全局讲解</span><span lang="en">Big picture</span></a><a href="flow.html"><span lang="zh">流程图</span><span lang="en">Flow</span></a><a href="ui.html"><span lang="zh">现有界面</span><span lang="en">Current UI</span></a></span>
<div class="lang"><button data-l="zh">中文</button><button data-l="en">EN</button></div></div>
</header>
<div class="layout">
<nav class="rail" id="rail"></nav>
<section class="stage">
<div class="ctrl"><button id="prev">←</button><div class="t" id="title"></div><button id="next" class="primary">→</button></div>
<div class="browser"><div class="chrome"><i></i><i></i><i></i><div class="url" id="url"></div></div><div class="screen" id="screen"></div></div>
<div class="kbd"><span lang="zh">界面是低保真重建，用于理解流程，不是 28Watt 的真实截图。键盘 ← → 翻页。</span><span lang="en">Low-fi reconstruction to understand the flow, not real 28Watt screenshots. Use ← → keys.</span></div>
</section>
<aside class="notes" id="notes"></aside>
</div>
<script>
const LOGO='<div class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="#25576e" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 21V9l8-6 8 6v12h-5"/><path d="M9 16l6-6m0 0h-4m4 0v4"/></svg><span><b>28</b>Watt</span></div>';
const T=(zh,en)=>`<span lang="zh">${zh}</span><span lang="en">${en}</span>`;
const nav=(right='<span class="pill dark">Log in</span>')=>`<div class="topnav">${LOGO}${right}</div>`;
const wizSteps=(on)=>['Contact details','Company profile','Verify email'].map((s,i)=>`<div class="st ${i<on?'done':i===on?'on':''}"><div class="c">${i<on?'✓':i+1}</div>${s}</div>`).join('');
const side=(on)=>`<div class="side"><div class="org">Solar Collective</div><div class="orgs">Maya Okafor · Admin</div><span class="pill dark new">+ New application</span>
${[['Alerts','4'],['Deals','12'],['Payouts',''],['Messages','1']].map(([n,c])=>`<div class="it ${n===on?'on':''}">${n}${c?`<b>${c}</b>`:''}</div>`).join('')}
<div class="grp">Account</div>${['Payout details','Accreditation docs','Products installed'].map(n=>`<div class="it ${n===on?'on':''}">${n}</div>`).join('')}
<div class="grp">Team & admin</div>${['Company details','Team members'].map(n=>`<div class="it ${n===on?'on':''}">${n}</div>`).join('')}</div>`;
const shell=(on,body)=>nav('<span style="font-size:12.5px;color:var(--mute)">Maya Okafor ▾</span>')+`<div class="shell">${side(on)}<div class="pmain">${body}</div></div>`;

const S=[
/* ---------------- ONBOARDING ---------------- */
{ph:['一次性注册','Onboarding'],t:['注册 1/3：联系方式','Sign-up 1/3: Contact details'],url:'28watt.com.au/installers/sign-up',ev:'v',
html:nav()+`<div class="wiz"><div class="steps">${wizSteps(0)}</div><div class="main"><div class="h">Contact details</div><div class="hs">Let’s start with your personal contact information.</div>
<div class="formcard"><div class="row"><div class="f"><label>First name <i>*</i></label><div class="inp v">Maya</div></div><div class="f"><label>Last name <i>*</i></label><div class="inp v">Okafor</div></div></div>
<div class="row"><div class="f"><label>Email <i>*</i></label><div class="inp v">maya@solarcollective.com.au</div></div><div class="f"><label>Mobile <i>*</i></label><div class="inp v">0412 345 678</div></div></div>
<div style="font-size:11px;color:var(--mute);text-align:center">By clicking 'Continue', you acknowledge and accept the 28Watt Terms & Conditions and Privacy Policy.</div></div>
<div class="foot"><span class="back">‹ Back</span><span class="pill dark">Continue</span></div></div></div>`,
what:['销售或老板第一次来 28Watt，填自己的联系方式。必须用<b>公司邮箱</b>，Gmail 这类个人邮箱会被拒。','A sales rep or owner signs up with their own details. A <b>company email</b> is required; Gmail etc. is rejected.'],
goal:['尽快开通，好给手上的客户报贷款方案。','Get set up fast so they can offer finance to a live customer.'],
op:['如果销售是在客户家里临时注册的，3 步加上人工审核会卡住当下这一单。可以考虑“先提交一单、后补资料”。','If a rep signs up mid-sale, 3 steps plus manual review stalls the deal in front of them. Consider “refer first, finish profile later”.']},
{ph:['一次性注册','Onboarding'],t:['注册 2/3：公司资料','Sign-up 2/3: Company profile'],url:'28watt.com.au/installers/sign-up',ev:'i',
html:nav()+`<div class="wiz"><div class="steps">${wizSteps(1)}</div><div class="main"><div class="h">Company profile</div><div class="hs">Tell us about your business.</div>
<div class="formcard"><div class="row"><div class="f"><label>Company name <i>*</i></label><div class="inp v">Solar Collective Pty Ltd</div></div><div class="f"><label>ABN <i>*</i></label><div class="inp v">12 345 678 901</div></div></div>
<div class="row"><div class="f"><label>Street address <i>*</i></label><div class="inp">Start typing your address…</div></div><div class="f"><label>State · Postcode <i>*</i></label><div class="inp v">NSW · 2022</div></div></div>
<div class="f"><label>Products you install</label><div class="chips"><span class="sel">Solar</span><span class="sel">Batteries</span><span>Heat pumps</span><span>EV chargers</span><span>Insulation</span></div></div>
<div class="f"><label>Residential or commercial?</label><div class="radio"><span class="sel">Both</span><span>Residential</span><span>Commercial</span></div></div></div>
<div class="foot"><span class="back">‹ Back</span><span class="pill dark">Continue</span></div></div></div>`,
what:['填公司信息：ABN 必须是 11 位，地址可以用 Google 搜索或手动填，安装的产品类型，住宅或商业。','Company info: 11-digit ABN, address (Google search or manual), products installed, residential/commercial.'],
goal:['证明自己是正规公司。','Prove they are a legitimate business.'],
ev2:['代码里能看到 ABN 校验、地址搜索和公司资料字段；界面布局和具体字段是推测的。','ABN validation, address search and company-profile fields exist in code; exact layout and field set are inferred.'],
op:['NETCC 认证、收款银行账户这些可以审核通过后再补，不要全塞在注册里。','Push NETCC docs and bank details to after approval rather than front-loading sign-up.']},
{ph:['一次性注册','Onboarding'],t:['注册 3/3：验证邮箱','Sign-up 3/3: Verify email'],url:'28watt.com.au/installers/sign-up',ev:'v',
html:nav()+`<div class="wiz"><div class="steps">${wizSteps(2)}</div><div class="main"><div class="h">Verify your email</div><div class="hs">Enter your verification code sent to maya@solarcollective.com.au</div>
<div class="formcard" style="text-align:center"><div class="otp"><span>4</span><span>8</span><span>1</span><span>9</span><span>0</span><span></span></div>
<div style="font-size:12.5px;color:var(--mute)">Didn’t receive a code? <u style="color:var(--teal)">Resend Code</u></div>
<div style="font-size:11.5px;color:var(--mute);margin-top:8px">If you don’t receive an email within a few minutes, please check your spam folder or contact support.</div></div>
<div class="foot"><span class="back">‹ Back</span><span class="pill dark">Verify email</span></div></div></div>`,
what:['输入邮箱收到的验证码。','Enter the code emailed to them.'],goal:['完成注册。','Finish sign-up.'],
op:['公司邮箱的验证邮件经常进垃圾箱。可以提供手机短信验证作为备选。','Company mail filters often catch these. Offer SMS as a fallback.']},
{ph:['一次性注册','Onboarding'],t:['等待人工审核','Pending review'],url:'28watt.com.au/installers/sign-up',ev:'v',
html:nav()+`<div class="center"><div class="badge">⏳</div><div class="h">Thanks for registering</div><div class="hs" style="max-width:440px">Your account request is now with our partnerships team for review. We’ll email you within 1 business day.</div>
<div class="card" style="text-align:left;width:420px"><h5>While you wait</h5><div class="doc"><span>Accreditation docs</span><span class="s-no">Add later</span></div><div class="doc"><span>Payout bank details</span><span class="s-no">Add later</span></div><div class="doc"><span>Invite your sales team</span><span class="s-no">After approval</span></div></div>
<span class="pill ghost">Book a call with Jake</span></div>`,
what:['28Watt 的 partnerships team 人工审核后，账户才能用。审核通过的通知文案是 “Account approved”。','The partnerships team reviews manually; then the account is approved (“Account approved”).'],
goal:['知道要等多久，等的时候能做什么。','Know how long it takes and what they can do meanwhile.'],
ev2:['“Thanks for registering… with our partnerships team for review. We’ll email you within…” 是代码里的原文；“1 business day” 和 “While you wait” 卡片是推测的。','“Thanks for registering… partnerships team for review. We’ll email you within…” is verbatim from code; “1 business day” and the “While you wait” card are inferred.'],
op:['等待期间让他们先把资质、收款账户补好，审核通过后就能直接用。','Use the wait to collect docs and payout details so they’re ready on approval.']},

let cur=0;
const rail=document.getElementById('rail');
function renderRail(){let h='',last='';S.forEach((s,i)=>{const k=s.ph.join('|');if(k!==last){h+=`<h4>${T(...s.ph)}</h4>`;last=k}
h+=`<button data-i="${i}" class="${i===cur?'on':i<cur?'done':''}"><span class="n">${i<cur?'✓':i+1}</span><span>${T(...s.t)}</span></button>`});rail.innerHTML=h;
rail.querySelectorAll('button').forEach(b=>b.onclick=()=>go(+b.dataset.i))}
function go(i){cur=Math.max(0,Math.min(S.length-1,i));const s=S[cur];
document.getElementById('screen').innerHTML=s.html;document.getElementById('url').textContent='https://'+s.url;
document.getElementById('title').innerHTML=`${cur+1} / ${S.length} · ${T(...s.t)}`;
const tag=s.ev==='v'?`<span class="tag v">${T('依据充分：官网或代码可见','Evidence: visible on site or code')}</span>`:`<span class="tag i">${T('部分推测','Partly inferred')}</span>`;
document.getElementById('notes').innerHTML=`<div class="nc">${tag}<h3>${T('这一步在做什么','What happens')}</h3><p>${T(...s.what)}</p><h3 style="margin-top:10px">${T('安装商想要什么','Installer’s goal')}</h3><p>${T(...s.goal)}</p>${s.ev2?`<h3 style="margin-top:10px">${T('依据','Evidence')}</h3><p style="color:var(--mute)">${T(...s.ev2)}</p>`:''}</div>
<div class="nc op"><h3>💡 ${T('设计机会','Design opportunity')}</h3><p>${T(...s.op)}</p></div>`;
renderRail();applyLang()}
document.getElementById('prev').onclick=()=>go(cur-1);document.getElementById('next').onclick=()=>go(cur+1);
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')go(cur+1);if(e.key==='ArrowLeft')go(cur-1)});
let L=(()=>{try{return localStorage.getItem('flowLang')}catch(e){}})()||'zh';
function applyLang(){document.body.classList.toggle('en',L==='en');document.documentElement.lang=L;document.querySelectorAll('.lang button').forEach(b=>b.classList.toggle('on',b.dataset.l===L))}
document.querySelectorAll('.lang button').forEach(b=>b.onclick=()=>{L=b.dataset.l;try{localStorage.setItem('flowLang',L)}catch(e){}applyLang()});
go(0);
</script>
</body></html>
